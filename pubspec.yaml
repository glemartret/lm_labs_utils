name: lm_labs_utils
description: "Reusable utilities for Flutter apps, packages, and plugins to encourage good coding practices"
repository: https://github.com/glemartret/lm_labs_utils
issue_tracker: https://github.com/glemartret/lm_labs_utils/issues?q=is%3Aissue+is%3Aopen+sort%3Aupdated-desc
version: 2.0.1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  connectivity_plus: ^7.0.0
  dio: ^5.9.1
  easy_debounce: ^2.0.3
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  hooks_riverpod: ^3.2.1
  i18n_extension: ^15.1.0
  json_annotation: ^4.10.0
  permission_handler: ^12.0.1
  riverpod_annotation: ^4.0.2

dev_dependencies:
  build_runner: ^2.11.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.12.0
  lm_labs_flutter_lints: ^1.0.0
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3

flutter:
  uses-material-design: true
